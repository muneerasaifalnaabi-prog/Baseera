<!-- Backdrop — click anywhere outside the drawer to close it -->
<div
  class="backdrop"
  [class.backdrop--visible]="open"
  (click)="onBackdropClick()"
  aria-hidden="true"
></div>

<aside
  class="sidebar"
  [class.sidebar--open]="open"
  [class.lang-ar]="lang.current() === 'ar'"
  [attr.dir]="lang.current() === 'ar' ? 'rtl' : 'ltr'"
  [attr.aria-hidden]="!open"
>
  <div class="sidebar__header">
    <span class="sidebar__title">{{ t[lang.current()].menu }}</span>
    <button type="button" class="sidebar__close" (click)="closeRequested.emit()" aria-label="Close menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <nav class="nav">
    <a routerLink="/select-child" routerLinkActive="nav-active" (click)="onNavClick()" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      {{ t[lang.current()].switchChild }}
    </a>

    <a routerLink="/assessment" routerLinkActive="nav-active" (click)="onNavClick()" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      {{ t[lang.current()].assessment }}
    </a>

    <a [routerLink]="vaultLink()" routerLinkActive="nav-active" (click)="onNavClick()" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 2v6h6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      {{ t[lang.current()].reports }}
    </a>

    <a routerLink="/activities" routerLinkActive="nav-active" (click)="onNavClick()" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      {{ t[lang.current()].activities }}
    </a>

    <a routerLink="/centers" routerLinkActive="nav-active" (click)="onNavClick()" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      {{ t[lang.current()].centers }}
    </a>

    @if (isAdmin()) {
      <span class="nav-label">{{ t[lang.current()].adminSection }}</span>
      <a routerLink="/admin" routerLinkActive="nav-active" (click)="onNavClick()" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2 3 7v6c0 5 4 9 9 9s9-4 9-9V7z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        {{ t[lang.current()].admin }}
      </a>
    }
  </nav>
</aside>
