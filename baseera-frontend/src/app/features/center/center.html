<h2>Specialized Centers</h2>

@for (center of centers; track center.id) {

  <div class="center-card">

    <h3>{{ center.name }}</h3>

    <p><strong>City:</strong> {{ center.city }}</p>

    <p><strong>Specialty:</strong> {{ center.specialty }}</p>

    <p><strong>Phone:</strong> {{ center.phone }}</p>

    <button (click)="openMap(center)">
      Get Directions
    </button>

    <hr>

  </div>

}

<div id="map"></div>
