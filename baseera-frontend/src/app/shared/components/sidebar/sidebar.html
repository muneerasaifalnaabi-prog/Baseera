<aside class="sidebar">
  <div class="profile">
    <div class="avatar">{{ fullName.charAt(0) }}</div>
    <p class="profile-name">{{ fullName }}</p>
  </div>

  <nav class="nav">
    <a routerLink="/home" routerLinkActive="nav-active" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 22V12h6v10" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      My dashboard
    </a>

    <a routerLink="/activities" routerLinkActive="nav-active" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Activities
    </a>

    @if (isAdmin()) {
      <a routerLink="/admin" routerLinkActive="nav-active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2 3 7v6c0 5 4 9 9 9s9-4 9-9V7z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Admin dashboard
      </a>
    }
  </nav>

  <button type="button" class="logout" (click)="logout()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Log out
  </button>
</aside>
