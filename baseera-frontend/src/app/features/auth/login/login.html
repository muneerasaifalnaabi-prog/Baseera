<div class="auth-page" [class.lang-ar]="lang === 'ar'" [attr.dir]="lang === 'ar' ? 'rtl' : 'ltr'">
  <div class="card">
    <section class="brand-panel">
      <img class="brand-panel__photo" src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=800&q=80" alt="" />
      <div class="brand-panel__overlay"></div>
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>

      <div class="brand-panel__content">
        <div class="brand-row">
          <!-- <div class="logo-badge">
            <img class="brand-panel__logo-small" src="assets/images/logo.png" alt="Baseera logo" />
          </div> -->
        </div>

        <div class="brand-panel__message">
          <h2>{{ t[lang].tagline }}</h2>
          <p>{{ t[lang].taglineSub }}</p>
        </div>

        <div class="trust-row">
          <span class="trust-icon">✦</span>
          <span class="trust-icon">♥</span>
          <span class="trust-text">{{ t[lang].joined }}</span>
        </div>
      </div>
    </section>

    <section class="form-panel">
      <button type="button" class="lang-toggle" (click)="toggleLang()">{{ t[lang].langLabel }}</button>

      <div class="form-panel__inner">
        <h2 class="form-title">{{ t[lang].title }}</h2>
        <p class="form-subtitle">{{ t[lang].subtitle }}</p>

        @if (errorMessage) {
          <div class="error-banner">{{ errorMessage }}</div>
        }

        <form (ngSubmit)="submit()">
          <div class="field">
            <label>{{ t[lang].email }}</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="m2 7 10 6 10-6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input type="email" [(ngModel)]="email" name="email" [placeholder]="t[lang].emailPlaceholder" required />
            </div>
          </div>

          <div class="field">
            <label>{{ t[lang].password }}</label>
            <div class="input-wrap">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••" required />
              <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                @if (!showPassword) {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                } @else {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M1 1l22 22" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                }
              </button>
            </div>
          </div>

          <div class="row-between">
            <label class="checkbox-label">
              <input type="checkbox" [(ngModel)]="keepSignedIn" name="keepSignedIn" />
              {{ t[lang].keepSignedIn }}
            </label>
            <a routerLink="/forgot-password" class="forgot-link">{{ t[lang].forgot }}</a>
          </div>

          <button type="submit" class="submit-button" [disabled]="loading">
            {{ loading ? '...' : t[lang].signIn }}
          </button>
        </form>

        <div class="divider"><span>{{ t[lang].or }}</span></div>

        <a href="http://localhost:8080/oauth2/authorization/google" class="google-button">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span>{{ t[lang].google }}</span>
        </a>

        <p class="switch-link">{{ t[lang].noAccount }} <a routerLink="/register">{{ t[lang].signup }}</a></p>
      </div>
    </section>
  </div>
</div>
