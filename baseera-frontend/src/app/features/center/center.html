<div class="page">
 
  <!-- Main Content -->
  <main class="content">
 
  <div class="header">
 
  <div>
    <h1 class="title">Specialized Centers</h1>
    <p class="subtitle">
      Find autism and ADHD centers near you.
    </p>
  </div>
 
</div>
 
    <!-- Search -->
  <div class="filter-bar">
 
  <div class="search-wrap">
 
    <svg width="18" height="18"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2">
 
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.3-4.3"
            stroke-linecap="round"/>
 
    </svg>
 
    <input
      type="text"
      placeholder="Search by center name or city..."
      [(ngModel)]="searchText"
      (input)="filterCenters()">
 
  </div>
 
  <div class="chip-row">
 
    <button
      class="chip"
      [class.chip-active]="selectedSpecialty=='ALL'"
      (click)="selectedSpecialty='ALL'; filterCenters()">
 
      All
 
    </button>
 
    <button
      class="chip"
      [class.chip-active]="selectedSpecialty=='ASD'"
      (click)="selectedSpecialty='ASD'; filterCenters()">
 
      ASD
 
    </button>
 
    <button
      class="chip"
      [class.chip-active]="selectedSpecialty=='ADHD'"
      (click)="selectedSpecialty='ADHD'; filterCenters()">
 
      ADHD
 
    </button>
 
    <button
      class="chip"
      [class.chip-active]="selectedSpecialty=='BOTH'"
      (click)="selectedSpecialty='BOTH'; filterCenters()">
 
      BOTH
 
    </button>
 
  </div>
 
  <button
      class="clear-button"
      (click)="searchText='';selectedSpecialty='ALL';filterCenters()">
 
      Clear
 
  </button>
 
</div>
 
    <!-- Main Body -->
    <div class="body">
 
      <!-- Cards -->
      <section class="cards">
 
        <div
          class="card"
          *ngFor="let center of filteredCenters"
          (click)="selectCenter(center)">
 
          <!-- Center Image -->
          <img
            [src]="getImage(center)"
            [alt]="center.name">
 
          <div class="info">
 
            <div class="top">
              <h3>{{ center.name }}</h3>
 
              <span class="badge">
                {{ center.specialty }}
              </span>
            </div>
 
            <p>📍 {{ center.city }}</p>
 
            <p>📞 {{ center.phone }}</p>
            <p>📏 {{ center.distance }} km away</p>
 
            <div class="buttons">
 
              <button
                class="view"
                (click)="selectCenter(center); $event.stopPropagation()">
                View on Map
              </button>
 
              <button
                class="direction"
                (click)="openDirections(center); $event.stopPropagation()">
                Get Directions
              </button>
 
            </div>
 
          </div>
 
        </div>
 
      </section>
 
      <!-- Map -->
      <section class="map">
 
        <div id="map"></div>
 
      </section>
 
    </div>
 
  </main>
 
</div>
