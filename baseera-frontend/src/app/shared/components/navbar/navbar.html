<header class="navbar">
  <div class="navbar__inner">
    @if (showSidebarToggle) {
      <button type="button" class="navbar__sidebar-toggle" (click)="sidebarToggled.emit()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
        </svg>
      </button>
    }

    <a routerLink="/home" class="navbar__brand">
      <span class="navbar__logo-mark">☺</span>
      <span class="navbar__logo-text">Baseera</span>
    </a>

    <button type="button" class="navbar__burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        @if (!menuOpen()) {
          <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
        } @else {
          <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
        }
      </svg>
    </button>

    <nav class="navbar__links" [class.navbar__links--open]="menuOpen()">
      <a routerLink="/home" routerLinkActive="navbar__link--active" (click)="closeMenu()" class="navbar__link">Home</a>
      <a routerLink="/select-child" routerLinkActive="navbar__link--active" (click)="closeMenu()" class="navbar__link">Switch child</a>
      <a routerLink="/activities" routerLinkActive="navbar__link--active" (click)="closeMenu()" class="navbar__link">Activities</a>
      <a routerLink="/centers" routerLinkActive="navbar__link--active" (click)="closeMenu()" class="navbar__link">Centers</a>
      <a [routerLink]="vaultLink()" routerLinkActive="navbar__link--active" (click)="closeMenu()" class="navbar__link">Reports</a>
      @if (isAdmin()) {
        <a routerLink="/admin" routerLinkActive="navbar__link--active" (click)="closeMenu()" class="navbar__link navbar__link--admin">Admin</a>
      }
    </nav>

    <div class="navbar__actions">
      <button type="button" class="navbar__lang" (click)="lang.toggle()">
        {{ lang.current() === 'en' ? 'العربية' : 'English' }}
      </button>

      <div class="navbar__account">
        <button type="button" class="navbar__avatar" (click)="toggleAccountMenu()" [attr.aria-expanded]="accountMenuOpen()">AA</button>

        @if (accountMenuOpen()) {
          <div class="navbar__account-menu">
            <button type="button" class="navbar__account-menu-item navbar__account-menu-item--danger" (click)="logout()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Log out
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
